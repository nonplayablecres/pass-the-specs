# Builds the app on GitHub's computers whenever you push a version tag (e.g. v0.1.1),
# then publishes a Release with the Windows exe, the Mac app and the update file.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # manual test build (no release)

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      # Also ship the unpacked folder: starts instantly (the single exe unpacks itself every launch)
      - run: Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/PassTheSpecs-win-folder.zip"
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/PassTheSpecs.exe
            release/PassTheSpecs-win-folder.zip
            release/pts-ui.zip
          generate_release_notes: true

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Signs and notarises with Apple when the secrets are set up (see README),
      # otherwise makes the same self-signed build as before.
      - name: Build Mac app
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build:ui
          if [ -n "$MAC_CERT" ]; then
            echo "Signing and notarising with Apple"
            CSC_LINK="$MAC_CERT" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD" npx electron-builder --mac zip --universal --publish never \
              -c.mac.hardenedRuntime=true -c.mac.notarize=true \
              -c.mac.entitlements=build/entitlements.mac.plist -c.mac.entitlementsInherit=build/entitlements.mac.plist
          else
            echo "No Apple certificate set up: self-signed build"
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dir --universal --publish never \
              -c.mac.identity=null -c.mac.hardenedRuntime=false
            APP="$(find release -maxdepth 2 -name '*.app' -type d | head -1)"
            echo "Signing $APP"
            # Self-sign everything (same as the build that used to work)...
            codesign --force --deep -s - "$APP"
            # ...then tell macOS to recognise the app by its ID, not by a fingerprint
            # of one half of the universal app. Otherwise the mic "Allow" never sticks.
            for h in "$APP"/Contents/Frameworks/*.app; do
              ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$h/Contents/Info.plist")
              codesign --force -s - -r="designated => identifier \"$ID\"" "$h"
            done
            codesign --force -s - -r='designated => identifier "com.passthespecs.app"' "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign -d -r- "$APP"
            ditto -c -k --keepParent "$APP" release/PassTheSpecs-mac-universal.zip
          fi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/PassTheSpecs-mac-*.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: mac-test
          path: release/PassTheSpecs-mac-*.zip
