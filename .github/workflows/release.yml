# Builds the app on GitHub's computers whenever you push a version tag (e.g. v0.1.1),
# then publishes a Release with the Windows exe, the Mac app and the update file.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      # Also ship the unpacked folder: starts instantly (the single exe unpacks itself every launch)
      - run: Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/PassTheSpecs-win-folder.zip"
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PassTheSpecs.exe
            release/PassTheSpecs-win-folder.zip
            release/pts-ui.zip
          generate_release_notes: true

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Signs and notarises with Apple when the secrets are set up (see README),
      # otherwise makes the same self-signed build as before.
      - name: Build Mac app
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build:ui
          if [ -n "$MAC_CERT" ]; then
            echo "Signing and notarising with Apple"
            CSC_LINK="$MAC_CERT" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD" npx electron-builder --mac zip --x64 --arm64 --publish never \
              -c.mac.hardenedRuntime=true -c.mac.notarize=true \
              -c.mac.entitlements=build/entitlements.mac.plist -c.mac.entitlementsInherit=build/entitlements.mac.plist
          else
            echo "No Apple certificate set up: self-signed build"
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac zip --x64 --arm64 --publish never -c.mac.identity=-
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: release/PassTheSpecs-mac-*.zip
