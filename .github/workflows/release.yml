# Builds the app on GitHub's computers whenever you push a version tag (e.g. v0.1.1),
# then publishes a Release with the Windows exe, the Mac app and the update file.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      # Also ship the unpacked folder: starts instantly (the single exe unpacks itself every launch)
      - run: Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/PassTheSpecs-win-folder.zip"
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PassTheSpecs.exe
            release/PassTheSpecs-win-folder.zip
            release/pts-ui.zip
          generate_release_notes: true

  build-mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # not code-signed (needs a paid Apple developer account)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:mac
      - uses: softprops/action-gh-release@v2
        with:
          files: release/PassTheSpecs-mac-*.zip
