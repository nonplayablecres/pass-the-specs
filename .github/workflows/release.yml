# Builds the app on GitHub's computers whenever you push a version tag (e.g. v0.1.1),
# then publishes a Release with the exe and the update file.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PassTheSpecs.exe
            release/pts-ui.zip
          generate_release_notes: true
