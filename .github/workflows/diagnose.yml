name: Drive self-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Make a 1 GB virtual card (V:) with a file on it
        shell: pwsh
        run: |
          "create vdisk file=`"$env:RUNNER_TEMP\card.vhdx`" maximum=1024 type=expandable`nattach vdisk`ncreate partition primary`nformat fs=exfat quick label=CARD`nassign letter=V" | Set-Content dp.txt
          diskpart /s dp.txt
          $bytes = New-Object byte[] (20MB); (New-Object Random 42).NextBytes($bytes); [IO.File]::WriteAllBytes('V:\photo.bin', $bytes)
          (Get-FileHash V:\photo.bin).Hash | Set-Content before.txt
      - run: npx electron scripts/drive-selftest.js V
        timeout-minutes: 5
      - name: Card formatted (FAT32)
        shell: pwsh
        run: |
          $vhd = Get-DiskImage -ImagePath "$env:RUNNER_TEMP\card.vhdx"
          $vols = Get-Disk -Number $vhd.Number | Get-Partition | Get-Volume
          Write-Output "::notice title=after::$($vols | Select-Object DriveLetter,FileSystem,Size,HealthStatus | ConvertTo-Json -Compress)"
          if (-not ($vols | Where-Object FileSystem -eq 'FAT32')) { exit 1 }
