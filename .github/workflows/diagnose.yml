name: Diagnose
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Raw disk reading from Node
        shell: pwsh
        run: |
          $js = @'
          const fs = require('fs');
          const paths = ['\\\\.\\PhysicalDrive0', '\\\\?\\GLOBALROOT\\Device\\Harddisk0\\DR0', '\\\\.\\C:'];
          (async () => {
            for (const p of paths) {
              const out = [];
              for (const flag of ['r', 'rs']) {
                try { const fd = fs.openSync(p, flag); const b = Buffer.alloc(1048576); const n = fs.readSync(fd, b, 0, b.length, 4096); out.push(flag + ':ok ' + n); fs.closeSync(fd); }
                catch (e) { out.push(flag + ':' + e.code + ' ' + e.message.slice(0, 80)); }
              }
              try { const h = await fs.promises.open(p, 'r'); const b = Buffer.alloc(8388608); const t = performance.now(); let bytes = 0; for (let i = 0; i < 64; i++) { const r = await h.read(b, 0, b.length, i * b.length); bytes += r.bytesRead; } out.push('promises:ok ' + Math.round(bytes / 1048576 / ((performance.now() - t) / 1000)) + 'MB/s'); await h.close(); }
              catch (e) { out.push('promises:' + e.code + ' ' + e.message.slice(0, 80)); }
              console.log('::notice title=' + p.replace(/\\/g, '/') + '::' + out.join(' | '));
            }
          })();
          '@
          Set-Content t.js $js
          node t.js
          node -e "console.log('::notice title=node::'+process.version+' '+process.versions.uv)"
          $o = winsat disk -drive c -seq -read 2>&1 | Select-String 'MB/s'
          Write-Output "::notice title=winsat::$o"
