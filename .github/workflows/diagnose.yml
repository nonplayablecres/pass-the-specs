name: Drive self-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron scripts/drive-selftest.js
        timeout-minutes: 5
