name: Write diag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Opening a wiped card
        shell: pwsh
        run: |
          "create vdisk file=`"$env:RUNNER_TEMP\card.vhdx`" maximum=1024 type=expandable`nattach vdisk`ncreate partition primary`nformat fs=exfat quick label=CARD`nassign letter=V" | Set-Content dp.txt
          diskpart /s dp.txt | Out-Null
          $n = (Get-Partition -DriveLetter V).DiskNumber
          Write-Output "::notice title=disk::$n"
          $js = @'
          const fs = require('fs'); const { execFileSync } = require('child_process'); const os = require('os'); const path = require('path');
          const n = process.argv[2]; const out = [];
          const dp = (lines) => { const f = path.join(os.tmpdir(), 'dp' + Date.now() + '.txt'); fs.writeFileSync(f, lines.join('\r\n') + '\r\n'); try { return execFileSync('diskpart', ['/s', f]).toString().split('\n').filter(Boolean).slice(-2).join(' ').trim(); } catch (e) { return 'diskpart failed ' + e.status; } };
          const disk = '\\\\.\\PhysicalDrive' + n;
          const b = Buffer.alloc(262144, 9);
          const t = (label, fn) => { try { out.push(label + ': ' + fn()); } catch (e) { out.push(label + ': ' + e.code + ' ' + e.errno + ' ' + e.syscall); } };
          // A: open before the wipe, keep it, write after
          let early = null;
          t('A open before wipe', () => { early = fs.openSync(disk, 'r+'); return 'ok'; });
          out.push('wipe: ' + dp(['select disk ' + n, 'clean']));
          t('A write after wipe (early handle)', () => fs.writeSync(early, b, 0, b.length, 64 * 1048576));
          t('A read back', () => { const g = Buffer.alloc(262144); fs.readSync(early, g, 0, g.length, 64 * 1048576); return g.equals(b) ? 'same' : 'different'; });
          try { fs.closeSync(early); } catch {}
          // B: open after the wipe, different ways
          for (const [lbl, p, f] of [['B r+', disk, 'r+'], ['B r', disk, 'r'], ['B rs+', disk, 'rs+'], ['B num O_RDWR', disk, fs.constants.O_RDWR], ['B globalroot r+', '\\\\?\\GLOBALROOT\\Device\\Harddisk' + n + '\\Partition0', 'r+'], ['B DR r+', '\\\\?\\GLOBALROOT\\Device\\Harddisk' + n + '\\DR' + n, 'r+']]) {
            t(lbl + ' open', () => { const fd = fs.openSync(p, f); let w = 'opened'; try { w += ', write ' + fs.writeSync(fd, b, 0, b.length, 64 * 1048576); } catch (e) { w += ', write ' + e.code; } fs.closeSync(fd); return w; });
          }
          // C: after initialising (create an empty partition table)
          out.push('convert mbr: ' + dp(['select disk ' + n, 'convert mbr']));
          t('C r+ after convert mbr', () => { const fd = fs.openSync(disk, 'r+'); const w = fs.writeSync(fd, b, 0, b.length, 64 * 1048576); fs.closeSync(fd); return 'wrote ' + w; });
          out.forEach((l) => console.log('::notice title=w::' + l));
          '@
          Set-Content t.js $js
          node t.js $n
